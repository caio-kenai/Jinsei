packages:
  - apps/*
  - packages/*
allowBuilds:
  '@scarf/scarf': false
  '@nestjs/core': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-express@12.5.0'
  - prettier@3.10.1

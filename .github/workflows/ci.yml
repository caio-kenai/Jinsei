name: Qualidade
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      CI: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jinsei
          POSTGRES_PASSWORD: jinsei_local
          POSTGRES_DB: jinsei
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jinsei" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm release:check
      - run: node scripts/check-sensitive-files.mjs
      - run: node scripts/validate-commit.mjs --self-test
      - name: Valida commits do pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-commit.mjs --range "$BASE_SHA..$HEAD_SHA"
      - run: pnpm db:generate && pnpm db:migrate
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm build
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

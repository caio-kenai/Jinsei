name: Apps
on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/android/**'
      - '.github/workflows/apps.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da versão já publicada, por exemplo v0.2.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: apps-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
            targets: ''
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            name: linux
            args: ''
            targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global --allow-scripts=pnpm pnpm@12.14.0
      - run: pnpm install --frozen-lockfile --filter @jinsei/desktop
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Instala as bibliotecas do Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Gera os instaladores
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm --filter @jinsei/desktop exec tauri build ${{ matrix.args }}
      - name: Reúne os instaladores
        shell: bash
        run: |
          mkdir -p dist-apps
          bundle=apps/desktop/src-tauri/target
          case "${{ matrix.name }}" in
            windows) cp "$(ls $bundle/release/bundle/nsis/*-setup.exe | head -1)" dist-apps/Jinsei-windows-x64-setup.exe ;;
            macos) cp "$(ls $bundle/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)" dist-apps/Jinsei-macos-universal.dmg ;;
            linux)
              cp "$(ls $bundle/release/bundle/appimage/*.AppImage | head -1)" dist-apps/Jinsei-linux-x86_64.AppImage
              cp "$(ls $bundle/release/bundle/deb/*.deb | head -1)" dist-apps/Jinsei-linux-amd64.deb
              ;;
          esac
          ls -l dist-apps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.name }}
          path: dist-apps/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/android/**/*.gradle.kts
      - name: Prepara a assinatura
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "Configure os segredos de assinatura do Android"; exit 1; fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/jinsei-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/jinsei-release.jks" >> "$GITHUB_ENV"
      - name: Gera o APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Reúne o APK
        run: |
          mkdir -p dist-apps
          apk="$(ls apps/android/app/build/outputs/apk/release/*.apk | head -1)"
          cp "$apk" dist-apps/Jinsei-android.apk
          ls -l dist-apps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-android
          path: dist-apps/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Anexa à release
    if: github.event_name != 'pull_request'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apps-*
          merge-multiple: true
          path: dist-apps
      - name: Anexa os apps e as somas de verificação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist-apps
          sha256sum Jinsei-* > SHA256SUMS-apps
          cat SHA256SUMS-apps
          gh release upload "$RELEASE_TAG" Jinsei-* SHA256SUMS-apps --clobber --repo "$REPOSITORY"
